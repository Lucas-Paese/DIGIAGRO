<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiAgro — Gestão Rural Inteligente</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Logo reutilizável: folhas + terra arada -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 42 42">
    <ellipse cx="21" cy="34" rx="12" ry="4" fill="rgba(139,100,50,.35)"/>
    <path d="M11 32Q17 29.5 21 32Q25 34.5 31 32" stroke="rgba(160,115,60,.7)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M13 35.5Q18 33.5 21 35.5Q24 37.5 29 35.5" stroke="rgba(160,115,60,.45)" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path d="M21 28C15 21 11 13 17 7C21 4 27 7 25 15C24 19 21 24 21 28Z" style="fill:var(--accent)"/>
    <path d="M21 28C27 21 31 13 25 7C21 4 15 7 17 15C18 19 21 24 21 28Z" style="fill:var(--accent)" opacity=".45"/>
    <line x1="21" y1="28" x2="21" y2="34" style="stroke:var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="18" cy="13" r="2" fill="rgba(255,255,255,.4)"/>
  </symbol>
</svg>

<!-- ═════════ LOGIN / CADASTRO ═════════ -->
<div id="auth">
  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="logo-mark big"><svg><use href="#logo"/></svg></div>
      <h1>DIGI<em>AGRO</em></h1>
      <p>Gestão Rural Inteligente</p>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-aba="login" onclick="trocarAba('login')">Entrar</button>
        <button class="auth-tab" data-aba="registrar" onclick="trocarAba('registrar')">Cadastrar</button>
      </div>

      <form class="auth-form active" id="form-login" onsubmit="entrar(event)">
        <div id="l-err" class="auth-err"></div>
        <div class="field"><label>Usuário</label><input id="l-user" autocomplete="username" placeholder="seu usuário" required></div>
        <div class="field"><label>Senha</label><input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
        <button class="btn btn-primary btn-full" id="l-btn">Entrar no sistema</button>
        <div class="auth-hint">Teste: usuário <strong>admin</strong> · senha <strong>admin123</strong></div>
      </form>

      <form class="auth-form" id="form-registrar" onsubmit="cadastrar(event)">
        <div id="r-err" class="auth-err"></div>
        <div class="field-row">
          <div class="field"><label>Nome completo</label><input id="r-nome" placeholder="João da Silva"></div>
          <div class="field"><label>Propriedade</label><input id="r-prop" placeholder="Sítio São João"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Usuário *</label><input id="r-user" autocomplete="username" placeholder="joao123" required></div>
          <div class="field"><label>Senha * (mín. 6)</label><input id="r-pass" type="password" autocomplete="new-password" placeholder="••••••••" required></div>
        </div>
        <div class="field-row">
          <div class="field"><label>E-mail</label><input id="r-email" type="email" placeholder="joao@email.com"></div>
          <div class="field"><label>Telefone</label><input id="r-tel" placeholder="(54) 99999-9999"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Cidade</label><input id="r-cidade" placeholder="Farroupilha - RS"></div>
          <div class="field"><label>Área total (ha)</label><input id="r-area" type="number" min="0" step="0.1" placeholder="0"></div>
        </div>
        <button class="btn btn-primary btn-full" id="r-btn">Criar conta</button>
      </form>
    </div>
  </div>
</div>

<!-- ═════════ APLICAÇÃO ═════════ -->
<div id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="logo-mark"><svg><use href="#logo"/></svg></div>
      <div class="sb-brand"><strong>DIGI<em>AGRO</em></strong><small>Gestão Rural</small></div>
      <button class="icon-btn sb-collapse" onclick="recolherMenu()" title="Recolher menu">‹</button>
    </div>
    <div class="sb-user">
      <div class="avatar" id="sb-avatar">?</div>
      <div class="sb-user-info"><div id="sb-nome" class="n">—</div><div id="sb-prop" class="p">—</div></div>
    </div>
    <nav class="sb-nav">
      <div class="sb-section">Principal</div>
      <button class="nav-item" data-page="dashboard" onclick="irPara('dashboard')"><span class="ico">▦</span><span class="lbl">Dashboard</span></button>
      <button class="nav-item" data-page="culturas" onclick="irPara('culturas')"><span class="ico">🌱</span><span class="lbl">Culturas</span><span class="badge-n" id="n-culturas">0</span></button>
      <button class="nav-item" data-page="colheitas" onclick="irPara('colheitas')"><span class="ico">🚜</span><span class="lbl">Colheitas</span><span class="badge-n" id="n-colheitas">0</span></button>
      <div class="sb-section">Financeiro</div>
      <button class="nav-item" data-page="financeiro" onclick="irPara('financeiro')"><span class="ico">💰</span><span class="lbl">Lançamentos</span><span class="badge-n" id="n-lancamentos">0</span></button>
      <button class="nav-item" data-page="insumos" onclick="irPara('insumos')"><span class="ico">📦</span><span class="lbl">Insumos</span><span class="badge-n" id="n-insumos">0</span></button>
      <div class="sb-section">Análise</div>
      <button class="nav-item" data-page="relatorios" onclick="irPara('relatorios')"><span class="ico">📊</span><span class="lbl">Relatórios</span></button>
      <div class="sb-section">Conta</div>
      <button class="nav-item" data-page="perfil" onclick="irPara('perfil')"><span class="ico">👤</span><span class="lbl">Meu perfil</span></button>
    </nav>
    <div class="sb-footer">
      <div class="theme-row"><span class="lbl">Tema claro</span><div class="toggle" id="toggle-tema" onclick="alternarTema()"><div class="knob"></div></div></div>
      <button class="btn btn-sm btn-danger" onclick="sair()"><span>↩</span><span class="lbl">Sair</span></button>
    </div>
  </aside>

  <div class="main" id="main">
    <header class="topbar">
      <button class="icon-btn" id="btn-menu" onclick="menuMobile()" aria-label="Menu">☰</button>
      <div class="breadcrumb">DigiAgro <span class="sep">›</span> <b id="crumb">Dashboard</b></div>
      <div class="topbar-right">
        <span class="status-db" title="Dados salvos no banco de dados do servidor"><i></i> Banco conectado</span>
        <div class="avatar sm" id="top-avatar" onclick="irPara('perfil')">?</div>
      </div>
    </header>
    <main class="conteudo" id="conteudo"></main>
  </div>
</div>

<!-- Modal genérico -->
<div class="overlay" id="modal"><div class="modal" id="modal-box"></div></div>

<!-- Confirmação -->
<div class="overlay" id="confirma">
  <div class="modal sm">
    <div class="modal-head"><span class="modal-title" id="c-titulo">Confirmar</span></div>
    <div class="modal-body"><p id="c-msg" class="c-msg"></p></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="c-nao">Cancelar</button>
      <button class="btn btn-danger" id="c-sim">Confirmar</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="/vendor/chart.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
